<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STARSLING — bend the comet, catch every star</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #05070f;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, sans-serif;
  }
  canvas {
    width: min(96vw, calc(96vh * 1.6));
    height: auto;
    aspect-ratio: 8 / 5;
    background: #0b1030;
    border-radius: 8px;
    box-shadow: 0 0 60px rgba(60, 100, 220, 0.35);
    cursor: crosshair;
    touch-action: none;
  }
</style>

<canvas id="game" width="960" height="600"></canvas>
